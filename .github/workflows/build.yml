name: Build FLR Visuals

on:
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract project ZIP
    run: |
      mkdir extracted
      ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "No ZIP project found in repository root"
        exit 1
      fi
      unzip -q "$ZIP_FILE" -d extracted

  - name: Build mod
    run: |
      GRADLEW=$(find extracted -type f -name gradlew -print -quit)
      if [ -z "$GRADLEW" ]; then
        echo "gradlew not found in ZIP"
        exit 1
      fi
      cd "$(dirname "$GRADLEW")"
      chmod +x ./gradlew
      ./gradlew build --no-daemon

  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: flr-visuals-jar
      path: extracted/**/build/libs/*.jar
      if-no-files-found: error
